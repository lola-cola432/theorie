<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theorie Stap voor Stap</title>
<meta name="theme-color" content="#2b4c7e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#fbf6ea; --card:#fffdf7; --ink:#1f1f1f; --soft:#5a5a5a; --line:#e4dccb;
    --accent:#2b4c7e; --accent-ink:#fff; --good:#1f7a3a; --good-bg:#e3f3e6; --bad:#a3361f; --bad-bg:#fbe6df;
    --chip:#efe7d4; --fs:20px;
  }
  body.wit{ --bg:#ffffff; --card:#f7f7f7; --line:#e2e2e2; --chip:#ededed; }
  body.donker{ --bg:#1d1f23; --card:#272a30; --ink:#f0ece2; --soft:#b9b4a8; --line:#3a3e46; --accent:#8fb3ec; --accent-ink:#111;
    --good:#7fd197; --good-bg:#1f3427; --bad:#f19a85; --bad-bg:#3d2520; --chip:#343842; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family: Verdana, Tahoma, "Segoe UI", Roboto, Arial, sans-serif;
    font-size:var(--fs); line-height:1.6; letter-spacing:.02em; word-spacing:.08em; -webkit-text-size-adjust:100%;}
  b{font-weight:700}
  .wrap{max-width:640px; margin:0 auto; padding:12px 16px 120px}
  header{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:2px solid var(--line)}
  .bar{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:8px 12px}
  .bar h1{font-size:1rem; margin:0; flex:1; line-height:1.25}
  .icon-btn{min-width:48px; min-height:48px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink);
    font-size:1rem; font-family:inherit; cursor:pointer; padding:0 10px}
  .lang{display:flex; border:2px solid var(--accent); border-radius:12px; overflow:hidden}
  .lang button{min-height:44px; min-width:52px; border:0; background:transparent; color:var(--accent); font:700 .9rem Verdana,sans-serif; cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
  h2{font-size:1.35rem; line-height:1.3; margin:18px 0 10px}
  h3{font-size:1.1rem; margin:0 0 8px; line-height:1.35}
  p{margin:0 0 12px; max-width:34em}
  .card{background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px; margin:14px 0}
  .steps{display:grid; gap:12px}
  .step{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card); color:var(--ink);
    border:2px solid var(--line); border-radius:16px; padding:14px 16px; font:inherit; cursor:pointer; min-height:72px}
  .step .num{flex:none; width:46px; height:46px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:1.1rem}
  .step .t{flex:1}
  .step .t small{display:block; color:var(--soft); font-size:.85rem; line-height:1.4}
  .prog{height:10px; border-radius:6px; background:var(--chip); overflow:hidden; margin-top:6px}
  .prog i{display:block; height:100%; background:var(--good); width:0}
  ul.lines{list-style:none; padding:0; margin:0 0 6px}
  ul.lines li{padding:8px 0 8px 0; border-bottom:1px dashed var(--line)}
  ul.lines li:last-child{border-bottom:0}
  .scene{background:#fff; border-radius:14px; overflow:hidden; border:2px solid var(--line); margin:4px 0 14px}
  .scene svg{display:block; width:100%; height:auto}
  .why{background:var(--chip); border-radius:14px; padding:12px 14px; margin:12px 0}
  .why h4{margin:0 0 4px; font-size:1rem}
  .src{font-size:.8rem; color:var(--soft); margin-top:10px}
  .terms{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px}
  .term{background:var(--chip); border-radius:10px; padding:4px 10px; font-size:.85rem}
  .term span{color:var(--soft)}
  .row{display:flex; gap:10px; margin-top:14px}
  .btn{flex:1; min-height:58px; border-radius:14px; border:2px solid var(--accent); background:var(--accent); color:var(--accent-ink);
    font:700 1rem Verdana,sans-serif; cursor:pointer; padding:8px 12px}
  .btn.ghost{background:transparent; color:var(--accent)}
  .btn:disabled{opacity:.4}
  .say{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 14px; border-radius:12px; border:2px solid var(--line);
    background:var(--card); color:var(--ink); font:700 .9rem Verdana,sans-serif; cursor:pointer}
  .say.on{border-color:var(--accent)}
  .opts{display:grid; gap:12px; margin-top:12px}
  .opt{min-height:64px; text-align:left; padding:12px 16px; border-radius:14px; border:3px solid var(--line); background:var(--card); color:var(--ink);
    font:inherit; cursor:pointer}
  .opt.good{border-color:var(--good); background:var(--good-bg)}
  .opt.bad{border-color:var(--bad); background:var(--bad-bg)}
  .verdict{font-weight:700; font-size:1.1rem; margin:14px 0 4px}
  .verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
  .counter{color:var(--soft); font-size:.9rem}
  .signrow{display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-start; margin:4px 0 12px}
  .sg{margin:0; text-align:center; background:#fff; border:2px solid var(--line); border-radius:12px; padding:6px 6px 2px; color:#1f1f1f}
  .sg figcaption{font-size:.8rem; font-weight:700}
  .ladder-q{font-size:1.15rem; font-weight:700}
  .done-badge{display:inline-block; background:var(--good-bg); color:var(--good); border-radius:10px; padding:2px 10px; font-size:.85rem; font-weight:700}
  dialog{border:0; border-radius:18px; padding:0; width:min(92vw,520px); background:var(--card); color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg{padding:18px}
  .seg{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 16px}
  .seg button{min-height:48px; padding:0 14px; border-radius:12px; border:2px solid var(--line); background:var(--bg); color:var(--ink); font:700 .9rem Verdana,sans-serif; cursor:pointer}
  .seg button[aria-pressed="true"]{border-color:var(--accent); outline:2px solid var(--accent)}
  .hint{color:var(--soft); font-size:.9rem}
  .fade{animation:f .25s ease}
  @keyframes f{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ .fade{animation:none} }
  .tlist{display:grid; gap:10px}
  .examcard{border-color:var(--accent)}
  .timer{position:sticky; top:66px; z-index:4; background:var(--accent); color:var(--accent-ink); border-radius:12px; padding:6px 12px; font-weight:700; display:flex; justify-content:space-between; margin-bottom:8px}
  .opt.sel{border-color:var(--accent); outline:2px solid var(--accent)}
  .pass{color:var(--good)} .fail{color:var(--bad)}
  table.res{width:100%; border-collapse:collapse; font-size:.9rem} table.res td{padding:6px 4px; border-bottom:1px dashed var(--line)} table.res td:last-child{text-align:right; font-weight:700; white-space:nowrap}
  .fun{display:flex; gap:10px; margin-top:28px; justify-content:center}
  .fun button{min-height:44px; padding:0 16px; border-radius:22px; border:2px dashed var(--line); background:transparent; color:var(--soft); font:700 .85rem Verdana,sans-serif; cursor:pointer}
  .joke{font-size:1.25rem; font-weight:700; text-align:center; padding:10px 0}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="icon-btn" id="homeBtn" aria-label="Home">⌂</button>
    <h1 id="appTitle">Theorie Stap voor Stap</h1>
    <div class="lang" role="group" aria-label="Taal / Language">
      <button id="lnNL" aria-pressed="true">NL</button>
      <button id="lnEN" aria-pressed="false">EN</button>
    </div>
    <button class="icon-btn" id="setBtn" aria-label="Instellingen">Aa</button>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script src="content.js"></script>
<script src="t2.js"></script>
<script src="t3.js"></script>
<script src="t4.js"></script>
<script src="t5.js"></script>
<script src="t6.js"></script>
<script src="t7.js"></script>
<script src="t8.js"></script>
<script src="t9.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
